server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    # En localhost las cookies se comparten entre puertos: las de Keycloak más las
    # de otras apps locales superan el búfer por defecto (8k) y nginx responde 400.
    large_client_header_buffers 4 32k;

    # DNS interno de Docker: se vuelve a resolver "api" si el contenedor se recrea
    # (con un nombre fijo en proxy_pass nginx guardaría la IP del arranque).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $keycloak_upstream http://keycloak:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La señalización WebRTC espera a que la cámara entregue el primer cuadro.
        proxy_read_timeout 30s;
    }

    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Keycloak (KC_HTTP_RELATIVE_PATH=/auth): mismo origen que la SPA, sin CORS.
    location /auth/ {
        proxy_pass $keycloak_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Las cookies y cabeceras de Keycloak no caben en los búferes por defecto.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
